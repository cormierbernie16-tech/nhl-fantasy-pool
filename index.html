<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NHL Fantasy Pool — Cormber Canadiens</title>
<style>
:root{--bg:#080d15;--panel:#111925;--panel2:#151f2d;--line:#273244;--text:#f4f7fb;--muted:#9aa7b8;--red:#e53935;--red2:#ff4a47;--green:#42d392;--gold:#f0bd55;--blue:#55a7ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:20;background:rgba(8,13,21,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 9px}
.brand{display:flex;gap:10px;align-items:center;color:#fff;text-decoration:none}.logo{width:38px;height:38px;border-radius:11px;background:var(--red);display:grid;place-items:center;font-weight:900;box-shadow:0 6px 20px #e5393533}.brand b{font-size:20px;letter-spacing:.4px}.brand b span{color:var(--red2)}.season{font-size:12px;color:var(--muted);letter-spacing:2px}
.tabs{display:flex;gap:8px;overflow:auto;padding:0 12px 11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:8px 13px;font-weight:700;font-size:12px;cursor:pointer}.tab.active{border-color:#e5393577;background:#e539351c;color:#fff}
main{padding:18px 14px}.page{display:none}.page.active{display:block}
h1{font-size:32px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.5px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:linear-gradient(145deg,var(--panel),#0e1622);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 25px #0002}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.teammark{width:60px;height:60px;border-radius:17px;background:#d9272e;display:grid;place-items:center;font-size:24px;font-weight:900}.record{font-size:28px;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:23px;font-weight:900}
.stat{font-size:22px;font-weight:900}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.bar{height:9px;background:#202a39;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:900;background:#253043;color:#dce5ef}.F{background:#214b38;color:#6ff0b3}.D{background:#243b58;color:#7fbdff}.G{background:#493c20;color:#ffd37b}.ok{color:var(--green)}.warn{color:var(--gold)}.danger{color:#ff7773}
.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#202b3a}.btn:active{transform:translateY(1px)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.table th{background:#172131;color:#aeb9c8;text-transform:uppercase;letter-spacing:.7px;font-size:10px;position:sticky;top:0}.table tr:last-child td{border-bottom:0}
.search{width:100%;background:#0e1622;border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:#fff;outline:none;margin-bottom:12px}.search:focus{border-color:#e5393577}
.notice{border:1px solid #f0bd5544;background:#f0bd5512;color:#f6d78f;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,22,33,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottomin{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bnav{padding:9px 2px 8px;background:none;border:0;color:#8793a3;font-size:10px;font-weight:800;cursor:pointer}.bnav.active{color:var(--red2)}.ico{display:block;font-size:19px;margin-bottom:3px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi .card{padding:11px}
.position{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.position .card{text-align:center}
.teamlist .row{cursor:pointer}.teamlist .row:hover{background:#ffffff05}
.rules li{margin:8px 0;color:#cbd4df;font-size:13px;line-height:1.45}
@media(max-width:650px){.grid2,.grid3{grid-template-columns:1fr}.kpi{grid-template-columns:repeat(2,1fr)}h1{font-size:29px}.app{padding-bottom:82px}}
@media(min-width:800px){main{padding:25px}.bottom{display:none}.app{padding-bottom:30px}.tabs{justify-content:center}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="top"><button class="brand" onclick="go('dashboard')" style="border:0;background:none"><span class="logo">CC</span><b>NHL FANTASY <span>POOL</span></b></button><span class="season">2026–27</span></div>
 <nav class="tabs" id="tabs"></nav>
</header>
<main>
<section id="dashboard" class="page active"></section>
<section id="team" class="page"></section>
<section id="players" class="page"></section>
<section id="schedule" class="page"></section>
<section id="league" class="page"></section>
<section id="transactions" class="page"></section>
<section id="rules" class="page"></section>
</main>
</div>
<nav class="bottom"><div class="bottomin" id="bottom"></div></nav>

<script>
const nav=[
 ['dashboard','Dashboard','⌂'],['team','My Team','🛡'],['players','Players','♙'],['schedule','Schedule','▣'],['league','League','🏆'],['transactions','Transactions','↔'],['rules','Rules','☷']
];
const skaters=[
 ['Connor McDavid','EDM','F',82,48,90],['Nikita Kucherov','TBL','F',76,44,86],['Nathan MacKinnon','COL','F',80,53,74],
 ['Macklin Celebrini','SJS','F',82,45,70],['Nick Suzuki','MTL','F',82,29,72],['Cole Caufield','MTL','F',81,51,37],
 ['Lane Hutson','MTL','D',82,12,66],['Cale Makar','COL','D',75,20,59],['Evan Bouchard','EDM','D',82,21,74],
 ['David Pastrnak','BOS','F',77,29,71],['Kirill Kaprizov','MIN','F',78,45,44],['William Nylander','TOR','F',65,30,49]
];
const goalies=[
 ['Andrei Vasilevskiy','TBL','G',58,39,15,4],['Karel Vejmelka','UTA','G',64,38,20,3],
 ['Jake Oettinger','DAL','G',54,35,12,6],['Logan Thompson','WSH','G',58,31,21,6],
 ['Jeremy Swayman','BOS','G',55,31,18,4],['Juuse Saros','NSH','G',59,28,22,8]
];
const players=[...skaters.map(x=>({...{name:x[0],nhl:x[1],pos:x[2],gp:x[3],g:x[4],a:x[5]},type:'skater'})),...goalies.map(x=>({...{name:x[0],nhl:x[1],pos:x[2],gp:x[3],w:x[4],l:x[5],ot:x[6]},type:'goalie'}))];
const roster=[
 ['Cole Caufield','MTL','F',5100000],['Nick Suzuki','MTL','F',10100000],['Connor McDavid','EDM','F',13800000],
 ['David Pastrnak','BOS','F',10000000],['Macklin Celebrini','SJS','F',11500000],['Kirill Kaprizov','MIN','F',8900000],
 ['William Nylander','TOR','F',7900000],['Nathan MacKinnon','COL','F',12700000],['Nikita Kucherov','TBL','F',13000000],['Lane Hutson','MTL','D',7800000],
 ['Cale Makar','COL','D',7900000],['Evan Bouchard','EDM','D',9500000],['Zach Werenski','CBJ','D',8100000],['Mika Zibanejad','NYR','F',7800000],
 ['Sebastian Aho','CAR','F',8000000],['Andrei Vasilevskiy','TBL','G',8500000],['Jake Oettinger','DAL','G',7000000],['TBD Reserve','—','R',0]
];
const teams=['Cormber Canadiens','Acadian Aces','Atlantic Blades','Bay of Fundy Bruins','Capital Chargers','Dieppe Dynamos','East Coast Eagles','Fundy Flames','Harbour Hawks','Maple Mariners','Moncton Moose','North Shore Knights','Quebec Nordiques','River Rats','Saint John Saints','Seacoast Senators','Shediac Sharks','Trinity Titans','Western Wolves','Prairie Pucksters','Calgary Cougars','Edmonton Ice','Fraser Flyers','Golden Knightsmen','Islanders West','Lakehead Legends','Manitoba Mooseheads','Pacific Pirates','Rocky Mountain Royals','Saskatoon Skaters','Thunder Bay Thunder','Vancouver Voyagers','Victoria Vipers','Winnipeg Warriors','Yukon Yetis','Northern Stars'];
const division=['Atlantic','Metropolitan','Central','Pacific'];

function money(n){return '$'+n.toLocaleString('en-CA')}
function pos(p){return '<span class="badge '+p+'">'+p+'</span>'}
function setPages(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab,.bnav').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}
function go(id){history.pushState({page:id},'', '#'+id);render(id);window.scrollTo({top:0,behavior:'smooth'})}
window.onpopstate=()=>render(location.hash.slice(1)||'dashboard');
function render(id){if(!nav.some(x=>x[0]===id))id='dashboard';setPages(id);document.getElementById(id).innerHTML=views[id]();}

document.getElementById('tabs').innerHTML=nav.map(n=>`<button class="tab" data-page="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
document.getElementById('bottom').innerHTML=nav.slice(0,5).map(n=>`<button class="bnav" data-page="${n[0]}" onclick="go('${n[0]}')"><span class="ico">${n[2]}</span>${n[1]}</button>`).join('');

const views={
dashboard:()=>`<h1>Dashboard</h1><div class="sub">Cormber Canadiens • Week 1 • 2026–27 fantasy season</div>
<div class="card hero"><div><div class="label">Your Team</div><h2 style="margin:4px 0">Cormber Canadiens</h2><div class="muted small">Montreal Canadiens identity</div></div><div class="teammark">CC</div></div>
<div class="kpi" style="margin-top:12px"><div class="card"><div class="label">Record</div><div class="stat">0–0–0</div></div><div class="card"><div class="label">Standings</div><div class="stat">0 pts</div></div><div class="card"><div class="label">Cap Used</div><div class="stat">$132.3M</div></div><div class="card"><div class="label">Active</div><div class="stat">20/20</div></div></div>
<div class="notice" style="margin-top:12px"><b>Data status:</b> This free build uses sample player records until the verified 2025–26 NHL import is loaded.</div>
<div class="grid grid2"><div class="card"><h3>Next Opponent</h3><div class="big">Acadian Aces</div><div class="muted small">Fantasy Week 1</div></div><div class="card"><h3>Transactions</h3><div class="big">Open</div><div class="muted small">Deadline Tuesday 4:00 AM ET</div></div></div>
<div class="card" style="margin-top:12px"><h3>League Format</h3><div class="row"><span>Division rivals</span><b>38 games</b></div><div class="row"><span>Same-conference, other division</span><b>28 games</b></div><div class="row"><span>Other conference</span><b>18 games</b></div><div class="row"><span>Total</span><b>84 games</b></div></div>`,

team:()=>`<h1>My Team</h1><div class="sub">Cormber Canadiens • 2 G • 6 D • 12 F active roster</div>
<div class="card"><div class="hero"><div><div class="label">Salary Cap</div><div class="big">$132.3M / $100M</div></div><span class="danger">OVER CAP</span></div><div class="bar"><i style="width:100%"></i></div><p class="small muted">This screen is a roster-management prototype. Transactions will enforce the $100M cap and minimum active positions.</p></div>
${[['Forwards',roster.filter(x=>x[2]==='F')],['Defencemen',roster.filter(x=>x[2]==='D')],['Goaltenders',roster.filter(x=>x[2]==='G')],['Reserve',roster.filter(x=>x[2]==='R')]].map(([title,arr])=>`<div class="card" style="margin-top:12px"><h2>${title} <span class="muted">(${arr.length})</span></h2>${arr.map(x=>`<div class="row"><div>${pos(x[2]==='R'?'badge':x[2])} <b>${x[0]}</b> <span class="muted">${x[1]}</span></div><b>${money(x[3])}</b></div>`).join('')}</div>`).join('')}`,

players:()=>`<h1>Players</h1><div class="sub">Search the player pool • salary is based on prior-season fantasy formula</div>
<input class="search" id="playerSearch" placeholder="Search player or NHL team…" oninput="filterPlayers(this.value)">
<div class="notice">Sample/demo data shown. Verified 2025–26 NHL player import should replace these records before the pool opens.</div>
<div class="tablewrap"><table class="table"><thead><tr><th>Player</th><th>Team</th><th>Pos</th><th>GP</th><th>G</th><th>A</th><th>Fantasy salary</th><th>Status</th></tr></thead><tbody id="playerRows"></tbody></table></div>`,
schedule:()=>`<h1>Schedule</h1><div class="sub">Custom fantasy schedule aligned to the NHL regular-season calendar</div>
<div class="grid grid3"><div class="card"><div class="label">Division</div><div class="big">38</div><div class="muted small">games</div></div><div class="card"><div class="label">Same Conference</div><div class="big">28</div><div class="muted small">games</div></div><div class="card"><div class="label">Other Conference</div><div class="big">18</div><div class="muted small">games</div></div></div>
<div class="notice" style="margin-top:12px">The NHL regular season runs Sept. 29, 2026 through Apr. 10, 2027. Your fantasy schedule uses the NHL calendar as its time framework, but keeps your custom 38/28/18 opponent structure.</div>
<div class="card"><h2>Fantasy Weeks</h2>${Array.from({length:8},(_,i)=>`<div class="row"><div><b>Week ${i+1}</b><div class="muted small">${i===0?'Sep 29 – Oct 5':'Upcoming fantasy week'}</div></div><span class="badge">${i===0?'CURRENT':'UPCOMING'}</span></div>`).join('')}</div>`,
league:()=>`<h1>League</h1><div class="sub">36 fantasy teams • 2 conferences • 4 divisions • 9 teams per division</div>
<div class="card"><h2>Standings</h2><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Team</th><th>Conf.</th><th>Div.</th><th>W</th><th>T</th><th>L</th><th>Pts</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td>${i+1}</td><td><b>${t}</b></td><td>${i<18?'East':'West'}</td><td>${division[Math.floor(i/9)%4]}</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>`).join('')}</tbody></table></div></div>`,
transactions:()=>`<h1>Transactions</h1><div class="sub">Weekly transaction window • deadline Tuesday 4:00 AM</div>
<div class="notice"><b>Rules enforced:</b> active roster must always contain exactly 2 goaltenders, 6 defencemen and 12 forwards. Reserve maximum is 3 players.</div>
<div class="grid grid2"><div class="card"><h2>Add / Drop</h2><p class="small muted">Pick up an available player and drop an owned player during the transaction window.</p><button class="btn" onclick="alert('Transaction screen ready for player-pool integration.')">Open Add / Drop</button></div><div class="card"><h2>Reserve</h2><p class="small muted">Reserve may be used for injury or underperformance and does not count against the cap.</p><button class="btn secondary" onclick="alert('Reserve manager ready for roster integration.')">Manage Reserve</button></div></div>
<div class="card" style="margin-top:12px"><h2>Transaction History</h2><div class="row"><span class="muted">No transactions yet</span><span class="badge">WEEK 1</span></div></div>`,
rules:()=>`<h1>Rules</h1><div class="sub">Cormier's Puck Pool • official pool rules</div>
<div class="card rules"><h2>League</h2><ul><li>36 fantasy teams: 18 Eastern Conference and 18 Western Conference.</li><li>Each conference has two divisions with 9 fantasy teams each.</li><li>Each team plays 84 fantasy games.</li><li>Schedule structure: <b>38 division rivals + 28 other division in the same conference + 18 other conference</b>.</li></ul>
<h2>Roster</h2><ul><li>2 goaltenders, 6 defencemen and 12 forwards active (20 total).</li><li>Maximum 3 reserve/IR players.</li><li>Reserve players remain owned and cannot be claimed by another team.</li></ul>
<h2>Scoring</h2><ul><li>Skater goal = 1 point; assist = 1 point.</li><li>Goalie regulation win = 2; OT/SO win = 2; regulation loss = 0; OT/SO loss = 1; tie after 60 minutes = 1.</li><li>Weekly head-to-head: higher total wins; equal totals are a tie. Standings: win 2, tie 1, loss 0.</li></ul>
<h2>Salary</h2><ul><li>$100,000,000 team cap.</li><li>Skater salary = (2025–26 goals + assists) × $100,000.</li><li>Goalie salary = (2×wins + 60-minute ties + OT/SO losses) × $100,000.</li><li>No 2025–26 regular-season stats = $100,000 minimum.</li><li>Salary is fixed for the fantasy season.</li></ul>
<h2>Transactions</h2><ul><li>Trades and reserve movements are weekly, with a Tuesday 4:00 AM deadline.</li><li>Teams must maintain 2 G, 6 D and 12 F active even during roster moves.</li><li>By the end of October, every team must have 3 reserve players.</li></ul></div>`
};

function fillPlayers(q=''){
 const rows=players.filter(p=>(p.name+' '+p.nhl).toLowerCase().includes(q.toLowerCase()));
 document.getElementById('playerRows').innerHTML=rows.map(p=>{
   const salary=p.type==='skater'?(p.g+p.a)*100000:Math.max(100000,(2*p.w+p.ot)*100000);
   return `<tr><td><b>${p.name}</b></td><td>${p.nhl}</td><td>${pos(p.pos)}</td><td>${p.gp}</td><td>${p.g??'—'}</td><td>${p.a??'—'}</td><td>${money(salary)}</td><td><span class="badge">AVAILABLE</span></td></tr>`
 }).join('');
}
function filterPlayers(q){fillPlayers(q)}
const oldRender=render; render=function(id){oldRender(id);if(id==='players')fillPlayers()}
render(location.hash.slice(1)||'dashboard');
</script>
</body>
</html>
