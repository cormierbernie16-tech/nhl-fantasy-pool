<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>NHL Fantasy Pool 2026–27</title><style>
:root{--bg:#080d15;--p:#111a27;--p2:#172233;--l:#2a3749;--t:#f5f7fb;--m:#9aa8ba;--r:#e53935;--g:#41d392}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:78px}header{position:sticky;top:0;background:#080d15ee;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--l)}.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:19px}.season{color:var(--m);font-size:11px;letter-spacing:1px}.nav{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.nav button,.bottom button{border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:10px;padding:8px 11px;font-weight:800;white-space:nowrap}.nav .on,.bottom .on{color:#fff;border-color:#e5393577;background:#e5393522}.page{display:none;padding:18px 12px}.page.on{display:block}h1{margin:0 0 4px;font-size:29px}h2{font-size:18px;margin:0 0 12px}.sub,.muted{color:var(--m)}.notice{padding:11px 12px;border:1px solid #f0bd5544;background:#f0bd5514;border-radius:12px;margin:12px 0;color:#f2d78f;font-size:12px}.card{background:linear-gradient(145deg,var(--p),#0e1622);border:1px solid var(--l);border-radius:15px;padding:13px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);font-size:12px;text-align:left}.table th{background:var(--p2);color:var(--m);font-size:10px;text-transform:uppercase}.logo{width:31px;height:31px;object-fit:contain;vertical-align:middle;margin-right:7px}.teamcell{display:flex;align-items:center;gap:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1622f7;border-top:1px solid var(--l);display:flex;justify-content:center;gap:4px;padding:7px;z-index:6}.bottom button{font-size:10px;padding:7px 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{font-size:24px;font-weight:900}.search{width:100%;padding:11px;border:1px solid var(--l);background:var(--p);color:#fff;border-radius:10px;margin:10px 0}.pending{color:#f0bd55;font-weight:800}.ok{color:var(--g)}@media(min-width:700px){.bottom{display:none}.page{padding:25px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header><div class="top"><div class="brand">NHL FANTASY POOL</div><div class="season">2026–27</div></div><div class="nav" id="nav"></div></header><main><section id="standings" class="page"></section><section id="team" class="page"></section><section id="players" class="page"></section><section id="schedule" class="page"></section><section id="league" class="page"></section><section id="transactions" class="page"></section><section id="rules" class="page"></section></main></div><div class="bottom" id="bottom"></div><script>
const NHL=[
['Canadiens','Eastern','Atlantic','MTL'],['Bruins','Eastern','Atlantic','BOS'],['Sabres','Eastern','Atlantic','BUF'],['Red Wings','Eastern','Atlantic','DET'],['Panthers','Eastern','Atlantic','FLA'],['Senators','Eastern','Atlantic','OTT'],['Lightning','Eastern','Atlantic','TBL'],['Maple Leafs','Eastern','Atlantic','TOR'],['Nordiques','Eastern','Atlantic','QUE'],
['Hurricanes','Eastern','Metropolitan','CAR'],['Blue Jackets','Eastern','Metropolitan','CBJ'],['Devils','Eastern','Metropolitan','NJD'],['Islanders','Eastern','Metropolitan','NYI'],['Rangers','Eastern','Metropolitan','NYR'],['Flyers','Eastern','Metropolitan','PHI'],['Penguins','Eastern','Metropolitan','PIT'],['Capitals','Eastern','Metropolitan','WSH'],['Whalers','Eastern','Metropolitan','HFD'],
['Blackhawks','Western','Central','CHI'],['Avalanche','Western','Central','COL'],['Stars','Western','Central','DAL'],['Wild','Western','Central','MIN'],['Predators','Western','Central','NSH'],['Blues','Western','Central','STL'],['Jets','Western','Central','WPG'],['Mammoth','Western','Central','UTA'],['North Stars','Western','Central','MNS'],
['Ducks','Western','Pacific','ANA'],['Flames','Western','Pacific','CGY'],['Oilers','Western','Pacific','EDM'],['Kings','Western','Pacific','LA'],['Sharks','Western','Pacific','SJ'],['Kraken','Western','Pacific','SEA'],['Canucks','Western','Pacific','VAN'],['Golden Knights','Western','Pacific','VGK'],['Golden Seals','Western','Pacific','OAK']];
const teams=NHL.map((x,i)=>({name:i===0?'Cormber Canadiens':`Team ${String(i+1).padStart(2,'0')} ${x[0]}`,nhl:x[0],conf:x[1],div:x[2],abbr:x[3],w:0,t:0,l:0}));
const logo=a=>`https://a.espncdn.com/i/teamlogos/nhl/500/${({TBL:'tb',NJD:'nj',LA:'la',SJ:'sj',VGK:'vgk',UTA:'utah'}[a]||a.toLowerCase())}.png`;
const retired={QUE:'https://upload.wikimedia.org/wikipedia/en/4/4b/Quebec_Nordiques_logo.svg',HFD:'https://upload.wikimedia.org/wikipedia/en/9/9a/Hartford_Whalers_logo.svg',MNS:'https://upload.wikimedia.org/wikipedia/en/1/1f/Minnesota_North_Stars_logo.svg',OAK:'https://upload.wikimedia.org/wikipedia/en/3/37/California_Golden_Seals_logo.svg'};
const img=t=>retired[t.abbr]||logo(t.abbr);
const skaters=[['Connor McDavid','EDM','F',48,90],['Nikita Kucherov','TBL','F',44,86],['Nathan MacKinnon','COL','F',53,74],['Macklin Celebrini','SJS','F',45,70],['Nick Suzuki','MTL','F',29,72],['Cole Caufield','MTL','F',51,37],['Lane Hutson','MTL','D',12,66],['Cale Makar','COL','D',20,59],['Evan Bouchard','EDM','D',21,74],['David Pastrnak','BOS','F',29,71],['Kirill Kaprizov','MIN','F',45,44],['William Nylander','TOR','F',30,49]].map(x=>({name:x[0],nhl:x[1],pos:x[2],g:x[3],a:x[4],pts:x[3]+x[4]})).sort((a,b)=>b.pts-a.pts);
const nav=[['standings','Standings'],['team','My Team'],['players','Players'],['schedule','Schedule'],['league','League'],['transactions','Transactions'],['rules','Rules']];
function go(id){location.hash=id;render(id)}function money(n){return '$'+n.toLocaleString('en-CA')}function render(id){if(!document.getElementById(id))id='standings';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===id));document.getElementById(id).innerHTML=views[id]()}
document.getElementById('nav').innerHTML=nav.map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');document.getElementById('bottom').innerHTML=nav.slice(0,5).map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
const views={
standings:()=>`<h1>Standings</h1><div class="sub">The main page of the fantasy pool • 36 teams</div><div class="notice"><b>Weekly update:</b> Standings finalize every Tuesday at 4:00 AM. Player statistics update daily at 4:00 AM.</div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>GP</th><th>W</th><th>T</th><th>L</th><th>PTS</th><th>Last 20</th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td><b>${i+1}</b></td><td><div class="teamcell"><img class="logo" src="${img(t)}" onerror="this.style.display='none'"><div><b>${t.name}</b><div class="muted">${t.conf} • ${t.div}</div></div></div></td><td>${t.w+t.t+t.l}</td><td>${t.w}</td><td>${t.t}</td><td>${t.l}</td><td><b>${t.w*2+t.t}</b></td><td>0–0–0</td></tr>`).join('')}</tbody></table></div></div><div class="grid"><div class="card"><div class="muted">Win</div><div class="kpi">2 pts</div></div><div class="card"><div class="muted">Tie</div><div class="kpi">1 pt</div></div><div class="card"><div class="muted">Loss</div><div class="kpi">0 pts</div></div><div class="card"><div class="muted">Last 20</div><div class="kpi">W–T–L</div></div></div>`,
team:()=>`<h1>My Team</h1><div class="sub">Cormber Canadiens • Active roster: 2 G / 6 D / 12 F</div><div class="card"><h2>Player Statistics</h2><div class="tablewrap"><table class="table"><thead><tr><th>Player</th><th>NHL</th><th>Pos</th><th>Goals</th><th>Assists</th><th>Points</th><th>Salary</th></tr></thead><tbody>${skaters.slice(0,12).map((p,i)=>`<tr><td><b>${p.name}</b></td><td>${p.nhl}</td><td>${p.pos}</td><td>${p.g}</td><td>${p.a}</td><td><b>${p.pts}</b></td><td>${money(p.pts*100000)}</td></tr>`).join('')}<tr><td><b>Andrei Vasilevskiy</b></td><td>TBL</td><td>G</td><td>—</td><td>—</td><td>—</td><td>$8.5M</td></tr></tbody></table></div></div><div class="notice">Roster management is the next working stage: trades and Reserve moves will be submitted during the week and take effect Tuesday at 4:00 AM.</div>`,
players:()=>`<h1>Players</h1><div class="sub">Default order: total points, highest to lowest</div><input id="q" class="search" placeholder="Search player or NHL team" oninput="filter(this.value)"><div class="notice">These are sample records. The full verified 2025–26 NHL player import will replace them before player selection opens.</div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Rank</th><th>Player</th><th>NHL</th><th>Pos</th><th>G</th><th>A</th><th>PTS</th><th>Salary</th></tr></thead><tbody id="prow"></tbody></table></div></div>`,
schedule:()=>`<h1>Schedule</h1><div class="sub">84 fantasy games using your custom opponent structure</div><div class="grid"><div class="card"><div class="muted">Division</div><div class="kpi">38</div></div><div class="card"><div class="muted">Same conference</div><div class="kpi">28</div></div><div class="card"><div class="muted">Other conference</div><div class="kpi">18</div></div><div class="card"><div class="muted">Total</div><div class="kpi">84</div></div></div><div class="notice">Fantasy week changes Tuesday at 4:00 AM. The 2026–27 NHL regular season runs Sept. 29, 2026 through Apr. 10, 2027.</div>`,
league:()=>`<h1>League</h1><div class="sub">Fantasy teams listed by NHL conference and division</div>${[['Eastern','Atlantic'],['Eastern','Metropolitan'],['Western','Central'],['Western','Pacific']].map(d=>`<div class="card"><h2>${d[0]} Conference • ${d[1]} Division</h2>${teams.filter(t=>t.conf===d[0]&&t.div===d[1]).map(t=>`<div class="teamcell" style="padding:8px 0;border-bottom:1px solid var(--l)"><img class="logo" src="${img(t)}" onerror="this.style.display='none'"><div><b>${t.name}</b><div class="muted">${t.nhl}</div></div></div>`).join('')}</div>`).join('')}`,
transactions:()=>`<h1>Transactions</h1><div class="sub">Requests are pending until the upcoming Tuesday at 4:00 AM</div><div class="notice"><b>Nothing takes effect immediately.</b> Trade, Add/Drop and Reserve requests made during the week remain pending. At Tuesday 4:00 AM the week closes, results finalize, and approved roster changes take effect for the new week.</div><div class="grid"><div class="card"><h2>Trade</h2><div class="pending">PENDING UNTIL TUESDAY 4:00 AM</div></div><div class="card"><h2>Reserve</h2><div class="pending">PENDING UNTIL TUESDAY 4:00 AM</div></div><div class="card"><h2>Add / Drop</h2><div class="pending">PENDING UNTIL TUESDAY 4:00 AM</div></div><div class="card"><h2>Roster Rules</h2><div>2 G • 6 D • 12 F active</div></div></div>`,
rules:()=>`<h1>Rules</h1><div class="card"><h2>Scoring</h2><p>Skater goal = 1 point. Assist = 1 point. Goalie regulation win = 2; OT/SO win = 2; regulation loss = 0; OT/SO loss = 1; tie after 60 minutes = 1.</p><h2>Standings</h2><p>Win = 2 standings points. Tie = 1. Loss = 0. Standings finalize Tuesday at 4:00 AM.</p><h2>Roster</h2><p>2 goaltenders, 6 defencemen, 12 forwards active. Maximum 3 Reserve players.</p><h2>Transactions</h2><p>Trade and Reserve movement requests remain pending during the week and take effect at the upcoming Tuesday 4:00 AM changeover.</p><h2>Salary Cap</h2><p>$100,000,000. Skater salary = (2025–26 Goals + Assists) × $100,000. Goalie salary = (2×Wins + 60-minute ties + OT/SO losses) × $100,000. No 2025–26 regular-season stats = $100,000 minimum.</p></div>`};
function filter(q=''){let a=skaters.filter(p=>(p.name+' '+p.nhl).toLowerCase().includes(q.toLowerCase()));document.getElementById('prow').innerHTML=a.map((p,i)=>`<tr><td>${i+1}</td><td><b>${p.name}</b></td><td>${p.nhl}</td><td>${p.pos}</td><td>${p.g}</td><td>${p.a}</td><td><b>${p.pts}</b></td><td>${money(p.pts*100000)}</td></tr>`).join('')}
function load(){let id=location.hash.slice(1)||'standings';render(id);if(id==='players')filter()}window.onhashchange=load;load();
</script></body></html>
