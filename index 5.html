<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHL Fantasy Pool 2026–27</title>
<style>
body{margin:0;background:#080d15;color:#f5f7fb;font:14px Arial,sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:70px}
header{position:sticky;top:0;background:#080d15ee;border-bottom:1px solid #2a3749;z-index:5}.top{padding:14px;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:19px}.season{color:#9aa8ba}
.nav{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.nav button{border:1px solid #2a3749;background:#111a27;color:#9aa8ba;border-radius:10px;padding:8px 11px;font-weight:800;white-space:nowrap}.nav .on{color:#fff;background:#e5393522}
.page{display:none;padding:18px 12px}.page.on{display:block}h1{font-size:28px;margin:0 0 4px}h2{margin:0 0 12px}.sub,.muted{color:#9aa8ba}.notice{padding:11px 12px;border:1px solid #f0bd5544;background:#f0bd5514;border-radius:12px;margin:12px 0;color:#f2d78f;font-size:12px}
.card{background:#111a27;border:1px solid #2a3749;border-radius:15px;padding:13px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid #2a3749;border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid #2a3749;text-align:left;font-size:12px}.table th{background:#172233;color:#9aa8ba;font-size:10px;text-transform:uppercase}.logo{width:31px;height:31px;object-fit:contain}.teamcell{display:flex;align-items:center;gap:7px}.conference{font-size:22px;margin:25px 0 8px;border-bottom:2px solid #2a3749;padding-bottom:8px}.division{font-size:18px;margin:0 0 10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1622f7;border-top:1px solid #2a3749;display:flex;justify-content:center;gap:5px;padding:7px}.bottom button{border:1px solid #2a3749;background:#111a27;color:#9aa8ba;border-radius:9px;padding:7px;font-size:10px}
</style></head><body><div class="app">
<header><div class="top"><div class="brand">NHL FANTASY POOL</div><div class="season">2026–27</div></div><div class="nav" id="nav"></div></header>
<main><section id="standings" class="page"></section><section id="team" class="page"></section><section id="players" class="page"></section><section id="schedule" class="page"></section><section id="league" class="page"></section><section id="transactions" class="page"></section><section id="rules" class="page"></section></main></div><div class="bottom" id="bottom"></div>
<script>
const NHL=[
['Canadiens','Eastern','Atlantic','MTL'],['Bruins','Eastern','Atlantic','BOS'],['Sabres','Eastern','Atlantic','BUF'],['Red Wings','Eastern','Atlantic','DET'],['Panthers','Eastern','Atlantic','FLA'],['Senators','Eastern','Atlantic','OTT'],['Lightning','Eastern','Atlantic','TBL'],['Maple Leafs','Eastern','Atlantic','TOR'],['Nordiques','Eastern','Atlantic','QUE'],
['Hurricanes','Eastern','Metropolitan','CAR'],['Blue Jackets','Eastern','Metropolitan','CBJ'],['Devils','Eastern','Metropolitan','NJD'],['Islanders','Eastern','Metropolitan','NYI'],['Rangers','Eastern','Metropolitan','NYR'],['Flyers','Eastern','Metropolitan','PHI'],['Penguins','Eastern','Metropolitan','PIT'],['Capitals','Eastern','Metropolitan','WSH'],['Whalers','Eastern','Metropolitan','HFD'],
['Blackhawks','Western','Central','CHI'],['Avalanche','Western','Central','COL'],['Stars','Western','Central','DAL'],['Wild','Western','Central','MIN'],['Predators','Western','Central','NSH'],['Blues','Western','Central','STL'],['Jets','Western','Central','WPG'],['Mammoth','Western','Central','UTA'],['North Stars','Western','Central','MNS'],
['Ducks','Western','Pacific','ANA'],['Flames','Western','Pacific','CGY'],['Oilers','Western','Pacific','EDM'],['Kings','Western','Pacific','LA'],['Sharks','Western','Pacific','SJ'],['Kraken','Western','Pacific','SEA'],['Canucks','Western','Pacific','VAN'],['Golden Knights','Western','Pacific','VGK'],['Golden Seals','Western','Pacific','OAK']];
const teams=NHL.map((x,i)=>({name:i===0?'Cormber Canadiens':'Team '+String(i+1).padStart(2,'0')+' '+x[0],nhl:x[0],conf:x[1],div:x[2],abbr:x[3],w:0,t:0,l:0}));
const logo=a=>`https://a.espncdn.com/i/teamlogos/nhl/500/${({TBL:'tb',NJD:'nj',LA:'la',SJ:'sj',VGK:'vgk',UTA:'utah'}[a]||a.toLowerCase())}.png`;
const retired={QUE:'https://upload.wikimedia.org/wikipedia/en/4/4b/Quebec_Nordiques_logo.svg',HFD:'https://upload.wikimedia.org/wikipedia/en/9/9a/Hartford_Whalers_logo.svg',MNS:'https://upload.wikimedia.org/wikipedia/en/1/1f/Minnesota_North_Stars_logo.svg',OAK:'https://upload.wikimedia.org/wikipedia/en/3/37/California_Golden_Seals_logo.svg'};
const img=t=>retired[t.abbr]||logo(t.abbr);
const nav=[['standings','Standings'],['team','My Team'],['players','Players'],['schedule','Schedule'],['league','League'],['transactions','Transactions'],['rules','Rules']];
function go(id){location.hash=id;render(id)}function render(id){if(!document.getElementById(id))id='standings';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===id));document.getElementById(id).innerHTML=views[id]()}
document.getElementById('nav').innerHTML=nav.map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
document.getElementById('bottom').innerHTML=nav.slice(0,5).map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
function group(conf,div){const list=teams.filter(t=>t.conf===conf&&t.div===div);return `<div class="card"><h2 class="division">${div} Division</h2><div class="tablewrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>GP</th><th>W</th><th>T</th><th>L</th><th>PTS</th><th>Last 20</th></tr></thead><tbody>${list.map((t,i)=>`<tr><td><b>${i+1}</b></td><td><div class="teamcell"><img class="logo" src="${img(t)}"><div><b>${t.name}</b><div class="muted">${t.nhl}</div></div></div></td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td><td>0–0–0</td></tr>`).join('')}</tbody></table></div></div>`}
const views={
standings:()=>`<h1>Standings</h1><div class="sub">36 fantasy teams • regular conference and division standings</div><div class="notice"><b>Weekly update:</b> Standings finalize Tuesday at 4:00 AM. Player statistics update daily at 4:00 AM.</div><h2 class="conference">Eastern Conference</h2>${group('Eastern','Atlantic')}${group('Eastern','Metropolitan')}<h2 class="conference">Western Conference</h2>${group('Western','Central')}${group('Western','Pacific')}`,
team:()=>`<h1>My Team</h1><div class="card"><h2>Cormber Canadiens</h2><div class="muted">Active roster: 2 G • 6 D • 12 F</div></div>`,
players:()=>`<h1>Players</h1><div class="notice">The full verified 2025–26 NHL player import will be loaded before player selection opens.</div>`,
schedule:()=>`<h1>Schedule</h1><div class="card"><h2>84 Fantasy Games</h2><p>38 division rivals • 28 same conference, other division • 18 other conference</p></div>`,
league:()=>`<h1>League</h1><div class="card"><p>36 teams: 18 Eastern and 18 Western, with 9 teams in each division.</p></div>`,
transactions:()=>`<h1>Transactions</h1><div class="notice">Trade, Add/Drop and Reserve requests remain pending until Tuesday at 4:00 AM.</div>`,
rules:()=>`<h1>Rules</h1><div class="card"><p>Win = 2 standings points • Tie = 1 • Loss = 0.</p><p>Roster: 2 G • 6 D • 12 F active, maximum 3 reserves.</p></div>`};
render(location.hash.slice(1)||'standings');
</script></body></html>
