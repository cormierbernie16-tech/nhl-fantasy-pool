<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>NHL Fantasy Pool 2026–27</title><style>
:root{--bg:#080d15;--p:#111a27;--p2:#172233;--l:#2a3749;--t:#f5f7fb;--m:#9aa8ba;--g:#41d392}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Arial,sans-serif}.app{max-width:1100px;margin:auto;padding-bottom:78px}header{position:sticky;top:0;background:#080d15ee;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--l)}.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:19px}.season{color:var(--m);font-size:11px;letter-spacing:1px}.nav{display:flex;gap:7px;overflow:auto;padding:0 12px 10px}.nav button,.bottom button{border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:10px;padding:8px 11px;font-weight:800;white-space:nowrap}.nav .on,.bottom .on{color:#fff;border-color:#e5393577;background:#e5393522}.page{display:none;padding:18px 12px}.page.on{display:block}h1{margin:0 0 4px;font-size:29px}h2{font-size:18px;margin:0 0 12px}.sub,.muted{color:var(--m)}.notice{padding:11px 12px;border:1px solid #f0bd5544;background:#f0bd5514;border-radius:12px;margin:12px 0;color:#f2d78f;font-size:12px}.card{background:linear-gradient(145deg,var(--p),#0e1622);border:1px solid var(--l);border-radius:15px;padding:13px;margin:12px 0}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);font-size:12px;text-align:left}.table th{background:var(--p2);color:var(--m);font-size:10px;text-transform:uppercase}.logo{width:31px;height:31px;object-fit:contain;vertical-align:middle;margin-right:7px}.teamcell{display:flex;align-items:center;gap:4px}.conference-title{font-size:22px;margin:24px 0 8px;padding-bottom:8px;border-bottom:2px solid var(--l)}.division-title{font-size:18px;margin:0 0 12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0e1622f7;border-top:1px solid var(--l);display:flex;justify-content:center;gap:4px;padding:7px;z-index:6}.bottom button{font-size:10px;padding:7px 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi{font-size:24px;font-weight:900}.search{width:100%;padding:11px;border:1px solid var(--l);background:var(--p);color:#fff;border-radius:10px;margin:10px 0}.pending{color:#f0bd55;font-weight:800}@media(min-width:700px){.bottom{display:none}.page{padding:25px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="app"><header><div class="top"><div class="brand">NHL FANTASY POOL</div><div class="season">2026–27</div></div><div class="nav" id="nav"></div></header><main><section id="standings" class="page"></section><section id="team" class="page"></section><section id="players" class="page"></section><section id="schedule" class="page"></section><section id="league" class="page"></section><section id="transactions" class="page"></section><section id="rules" class="page"></section></main></div><div class="bottom" id="bottom"></div><script>
const NHL=[['Canadiens','Eastern','Atlantic','MTL'],['Bruins','Eastern','Atlantic','BOS'],['Sabres','Eastern','Atlantic','BUF'],['Red Wings','Eastern','Atlantic','DET'],['Panthers','Eastern','Atlantic','FLA'],['Senators','Eastern','Atlantic','OTT'],['Lightning','Eastern','Atlantic','TBL'],['Maple Leafs','Eastern','Atlantic','TOR'],['Nordiques','Eastern','Atlantic','QUE'],['Hurricanes','Eastern','Metropolitan','CAR'],['Blue Jackets','Eastern','Metropolitan','CBJ'],['Devils','Eastern','Metropolitan','NJD'],['Islanders','Eastern','Metropolitan','NYI'],['Rangers','Eastern','Metropolitan','NYR'],['Flyers','Eastern','Metropolitan','PHI'],['Penguins','Eastern','Metropolitan','PIT'],['Capitals','Eastern','Metropolitan','WSH'],['Whalers','Eastern','Metropolitan','HFD'],['Blackhawks','Western','Central','CHI'],['Avalanche','Western','Central','COL'],['Stars','Western','Central','DAL'],['Wild','Western','Central','MIN'],['Predators','Western','Central','NSH'],['Blues','Western','Central','STL'],['Jets','Western','Central','WPG'],['Mammoth','Western','Central','UTA'],['North Stars','Western','Central','MNS'],['Ducks','Western','Pacific','ANA'],['Flames','Western','Pacific','CGY'],['Oilers','Western','Pacific','EDM'],['Kings','Western','Pacific','LA'],['Sharks','Western','Pacific','SJ'],['Kraken','Western','Pacific','SEA'],['Canucks','Western','Pacific','VAN'],['Golden Knights','Western','Pacific','VGK'],['Golden Seals','Western','Pacific','OAK']];
const teams=NHL.map((x,i)=>({name:i===0?'Cormber Canadiens':`Team ${String(i+1).padStart(2,'0')} ${x[0]}`,nhl:x[0],conf:x[1],div:x[2],abbr:x[3],w:0,t:0,l:0}));
const logo=a=>`https://a.espncdn.com/i/teamlogos/nhl/500/${({TBL:'tb',NJD:'nj',LA:'la',SJ:'sj',VGK:'vgk',UTA:'utah'}[a]||a.toLowerCase())}.png`;
const retired={QUE:'https://upload.wikimedia.org/wikipedia/en/4/4b/Quebec_Nordiques_logo.svg',HFD:'https://upload.wikimedia.org/wikipedia/en/9/9a/Hartford_Whalers_logo.svg',MNS:'https://upload.wikimedia.org/wikipedia/en/1/1f/Minnesota_North_Stars_logo.svg',OAK:'https://upload.wikimedia.org/wikipedia/en/3/37/California_Golden_Seals_logo.svg'};const img=t=>retired[t.abbr]||logo(t.abbr);
const nav=[['standings','Standings'],['team','My Team'],['players','Players'],['schedule','Schedule'],['league','League'],['transactions','Transactions'],['rules','Rules']];
function standingsGroup(conf,div){const list=teams.filter(t=>t.conf===conf&&t.div===div);return `<div class="card"><h2 class="division-title">${div} Division</h2><div class="tablewrap"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>GP</th><th>W</th><th>T</th><th>L</th><th>PTS</th><th>Last 20</th></tr></thead><tbody>${list.map((t,i)=>`<tr><td><b>${i+1}</b></td><td><div class="teamcell"><img class="logo" src="${img(t)}" onerror="this.style.display='none'"><div><b>${t.name}</b><div class="muted">${t.nhl}</div></div></div></td><td>${t.w+t.t+t.l}</td><td>${t.w}</td><td>${t.t}</td><td>${t.l}</td><td><b>${t.w*2+t.t}</b></td><td>0–0–0</td></tr>`).join('')}</tbody></table></div></div>`}
function go(id){location.hash=id;render(id)}function render(id){if(!document.getElementById(id))id='standings';document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===id));document.getElementById(id).innerHTML=views[id]()}
document.getElementById('nav').innerHTML=nav.map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');document.getElementById('bottom').innerHTML=nav.slice(0,5).map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
const views={
standings:()=>`<h1>Standings</h1><div class="sub">36 fantasy teams • organized like regular NHL standings</div><div class="notice"><b>Weekly update:</b> Standings finalize every Tuesday at 4:00 AM. Player statistics update daily at 4:00 AM.</div><h2 class="conference-title">Eastern Conference</h2>${standingsGroup('Eastern','Atlantic')}${standingsGroup('Eastern','Metropolitan')}<h2 class="conference-title">Western Conference</h2>${standingsGroup('Western','Central')}${standingsGroup('Western','Pacific')}<div class="grid"><div class="card"><div class="muted">Win</div><div class="kpi">2 pts</div></div><div class="card"><div class="muted">Tie</div><div class="kpi">1 pt</div></div><div class="card"><div class="muted">Loss</div><div class="kpi">0 pts</div></div><div class="card"><div class="muted">Last 20</div><div class="kpi">W–T–L</div></div></div>`,
team:()=>`<h1>My Team</h1><div class="sub">Cormber Canadiens • Active roster: 2 G / 6 D / 12 F</div><div class="card"><h2>Player Statistics</h2><p class="muted">Roster player data will be populated from the verified NHL import.</p></div>`,
players:()=>`<h1>Players</h1><div class="sub">Default order: total points, highest to lowest</div><input class="search" placeholder="Search player or NHL team"><div class="notice">The full verified 2025–26 NHL player import will replace the sample data before player selection opens.</div>`,
schedule:()=>`<h1>Schedule</h1><div class="sub">84 fantasy games using your custom opponent structure</div><div class="grid"><div class="card"><div class="muted">Division</div><div class="kpi">38</div></div><div class="card"><div class="muted">Same conference</div><div class="kpi">28</div></div><div class="card"><div class="muted">Other conference</div><div class="kpi">18</div></div><div class="card"><div class="muted">Total</div><div class="kpi">84</div></div></div>`,
league:()=>`<h1>League</h1><div class="sub">Fantasy teams listed by NHL conference and division</div>${[['Eastern','Atlantic'],['Eastern','Metropolitan'],['Western','Central'],['Western','Pacific']].map(d=>`<div class="card"><h2>${d[0]} Conference • ${d[1]} Division</h2>${teams.filter(t=>t.conf===d[0]&&t.div===d[1]).map(t=>`<div class="teamcell" style="padding:8px 0;border-bottom:1px solid var(--l)"><img class="logo" src="${img(t)}"><div><b>${t.name}</b><div class="muted">${t.nhl}</div></div></div>`).join('')}</div>`).join('')}`,
transactions:()=>`<h1>Transactions</h1><div class="notice"><b>Nothing takes effect immediately.</b> Trade, Add/Drop and Reserve requests remain pending until Tuesday at 4:00 AM.</div>`,
rules:()=>`<h1>Rules</h1><div class="card"><h2>Standings</h2><p>Win = 2 standings points. Tie = 1. Loss = 0.</p><h2>Roster</h2><p>2 goaltenders, 6 defencemen, 12 forwards active. Maximum 3 Reserve players.</p><h2>Salary Cap</h2><p>$100,000,000 per fantasy team.</p></div>`};
function load(){render(location.hash.slice(1)||'standings')}window.onhashchange=load;load();
</script></body></html>
